<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V11竖版修仙放置</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<div class="phone">
<header>
  <h1>仙途放置 V11</h1>
  <div class="topres">
    <span>🪙<b id="stone"></b></span>
    <span>💎<b id="jade"></b></span>
    <span>⚔️<b id="power"></b></span>
  </div>
</header>

<section class="stage">
  <div class="enemy">
    <div class="enemyIcon" id="enemyIcon">🐺</div>
    <h2 id="enemyName">妖狼</h2>
    <div class="hpbar"><div id="enemyHpBar"></div></div>
    <p><span id="enemyHp"></span>/<span id="enemyMaxHp"></span></p>
  </div>

  <div class="battleLine">
    <div class="hero">仙</div>
    <div id="floatText"></div>
  </div>

  <div class="player">
    <p>境界：<b id="realm"></b>　关卡：<b id="stageNo"></b>/1000</p>
    <div class="xpbar"><div id="xpbar"></div></div>
    <p>修为：<span id="xp"></span>/<span id="need"></span></p>
    <p>血量：<b id="hp"></b>/<b id="maxHp"></b>　攻击：<b id="atk"></b>　防御：<b id="def"></b></p>
  </div>
</section>

<section class="actions">
  <button onclick="toggleAuto()">自动闯关：<span id="autoText">开</span></button>
  <button onclick="attack()">手动攻击</button>
  <button onclick="heal()">自动吃药</button>
  <button onclick="breakthrough()">突破</button>
</section>

<section class="panel" id="main">
  <h3>主线成长</h3>
  <div class="grid">
    <button onclick="cultivate()">修炼</button>
    <button onclick="claimGift()">豪礼</button>
    <button onclick="rebirth()">飞升转生</button>
    <button onclick="saveGame()">保存</button>
  </div>
</section>

<section class="panel hide" id="equip">
  <h3>装备</h3>
  <p>武器：<b id="weapon"></b></p>
  <p>衣服：<b id="armor"></b></p>
  <p>戒指：<b id="ring"></b></p>
  <div class="grid">
    <button onclick="forge()">强化装备</button>
    <button onclick="autoEquip()">自动穿戴最好装备</button>
    <button onclick="openChest()">开神器宝箱</button>
    <button onclick="washEquip()">洗练属性</button>
  </div>
</section>

<section class="panel hide" id="pet">
  <h3>灵兽</h3>
  <p>出战：<b id="petName"></b> Lv.<b id="petLv"></b> ⭐<b id="petStar"></b></p>
  <div class="grid">
    <button onclick="petUp()">升级</button>
    <button onclick="petStarUp()">升星</button>
    <button onclick="changePet()">切换灵兽</button>
    <button onclick="petSkill()">释放技能</button>
  </div>
</section>

<section class="panel hide" id="shop">
  <h3>商城</h3>
  <div class="shopgrid" id="shopList"></div>
</section>

<section class="panel hide" id="realmPage">
  <h3>秘境 / BOSS</h3>
  <p>秘境层数：<b id="dungeonLv"></b>　扫荡令：<b id="ticket"></b></p>
  <div class="grid">
    <button onclick="dungeon()">秘境挑战</button>
    <button onclick="sweep()">扫荡十次</button>
    <button onclick="worldBoss()">世界BOSS</button>
    <button onclick="randomEvent()">随机奇遇</button>
  </div>
</section>

<section class="panel hide" id="sect">
  <h3>宗门 / 道侣</h3>
  <p>宗门：<b id="sectName"></b> Lv.<b id="sectLv"></b>　贡献：<b id="contrib"></b></p>
  <p>道侣：<b id="partner"></b>　好感：<b id="love"></b></p>
  <div class="grid">
    <button onclick="joinSect()">加入宗门</button>
    <button onclick="sectTask()">宗门任务</button>
    <button onclick="meetPartner()">结识道侣</button>
    <button onclick="dualCultivate()">双修</button>
  </div>
</section>

<section class="panel hide" id="bag">
  <h3>背包 / 成就</h3>
  <div id="bagList" class="bag"></div>
  <h3>成就</h3>
  <div id="achList" class="bag"></div>
</section>

<section class="logbox">
  <h3>日志</h3>
  <div id="log"></div>
</section>

<nav>
  <button onclick="tab('main')">主页</button>
  <button onclick="tab('equip')">装备</button>
  <button onclick="tab('pet')">灵兽</button>
  <button onclick="tab('shop')">商城</button>
  <button onclick="tab('realmPage')">秘境</button>
  <button onclick="tab('sect')">宗门</button>
  <button onclick="tab('bag')">背包</button>
</nav>
</div>
<script src="game.js"></script>
</body>
</html>
